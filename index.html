<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Quest AI | Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #030712; }
        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #374151; }
        :root { --paper:#f7f4ec; --ink:#171512; --muted:#6f6a62; --line:#cfc7b8; --gold:#b1842b; }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { margin:0; background:var(--paper) !important; color:var(--ink) !important; font-family: 'Inter', sans-serif; }
        #root, #root > div { min-height:100vh; background:var(--paper) !important; }
        nav { position:fixed !important; inset:0 0 auto; z-index:50; background:rgba(247,244,236,.94) !important; border-bottom:1px solid var(--line) !important; color:var(--ink) !important; backdrop-filter:blur(8px); }
        nav > div { max-width:1200px; min-height:74px; margin:auto; padding:12px 32px; display:flex; align-items:center; justify-content:space-between; }
        nav a { color:var(--ink) !important; text-decoration:none; letter-spacing:.16em; font-size:11px; }
        nav img { max-height:48px !important; width:auto !important; }
        main { padding-top:74px; }
        main > section { position:relative; border-bottom:1px solid var(--line); padding:96px max(32px, 5vw); background:var(--paper) !important; color:var(--ink) !important; }
        main > section > div { max-width:1200px; margin:0 auto; }
        h1, h2, h3, .brand-serif { font-family: Georgia, 'Times New Roman', 'Yu Mincho', serif !important; color:var(--ink) !important; }
        h2 { font-size:clamp(2.8rem,6vw,5.8rem) !important; line-height:.98 !important; }
        p { color:var(--muted); line-height:1.9; }
        img { max-width:100%; }
        .hero-paper { min-height:720px !important; padding:0 !important; display:flex; align-items:center; }
        .hero-paper-image { position:absolute; inset:0; max-width:none !important; background:linear-gradient(90deg, rgba(247,244,236,.98) 0%, rgba(247,244,236,.92) 33%, rgba(247,244,236,.14) 62%, rgba(247,244,236,.02) 100%), url('/img/hero-reference.png') right center / cover no-repeat; }
        .hero-paper-copy { padding:150px 6vw 90px !important; }
        .hero-paper-copy h1 { font-size:clamp(3.4rem,7vw,7rem) !important; max-width:620px; }
        .hero-paper-copy p { max-width:520px; }
        .hero-rule { display:inline-block; width:72px; height:1px; background:var(--ink); vertical-align:middle; }
        .hero-color-rule { display:flex; gap:18px; margin:28px 0 16px; }
        .hero-color-rule i { display:block; width:30px; height:3px; background:#bd2727; }
        .hero-color-rule i:nth-child(2){background:#5c2aa6}.hero-color-rule i:nth-child(3){background:#19a5cb}.hero-color-rule i:nth-child(4){background:#e36b27}.hero-color-rule i:nth-child(5){background:#e6b72d}.hero-color-rule i:nth-child(6){background:#5f9c45}
        .hero-caption { font-size:10px; letter-spacing:.22em; text-transform:uppercase; }
        section#about > div > div { background:#fff !important; border:1px solid var(--line); border-radius:0 !important; box-shadow:none !important; }
        section#about h2, main > section h2 { letter-spacing:-.06em; }
        main > section .grid { display:grid; gap:28px; }
        main > section img { object-fit:cover; }
        main > section button, main > section a { color:var(--ink); }
        footer { background:var(--paper) !important; border-top:1px solid var(--line) !important; color:var(--ink) !important; }
        footer img { max-height:44px !important; width:auto !important; }
        @media (max-width:800px){ nav > div{padding:10px 18px}.hero-paper{min-height:700px !important}.hero-paper-image{background:linear-gradient(180deg,rgba(247,244,236,.96) 0%,rgba(247,244,236,.78) 42%,rgba(247,244,236,.15) 100%),url('/img/hero-reference.png') 68% center/cover no-repeat}.hero-paper-copy{padding:128px 22px 70px !important}.hero-paper-copy h1{font-size:clamp(3rem,14vw,5rem) !important}main > section{padding:72px 20px}}
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.561.0"
  }
}
</script>
</head>
<body class="bg-gray-950 text-gray-100 antialiased selection:bg-red-600/30">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
