    <script>
    (function () {
      var MODE_KEY = 'dqa-theme';           // 'auto' | 'light' | 'dark'
      var DARK_FROM = 18, DARK_TO = 6;      // 18:00〜05:59 をダーク
      function isNight() { var h = new Date().getHours(); return h >= DARK_FROM || h < DARK_TO; }
      function resolve(mode) { return mode === 'dark' || (mode !== 'light' && isNight()); }
      function apply(mode) {
        var el = document.documentElement;
        // Typekit が className を文字列連結するため classList のみ使用
        if (resolve(mode)) el.classList.add('dark'); else el.classList.remove('dark');
        el.setAttribute('data-theme-mode', mode);
        try { window.dispatchEvent(new CustomEvent('dqa:themechange', { detail: { mode: mode, dark: resolve(mode) } })); } catch (e) {}
      }
      var saved = 'auto';
      try { saved = localStorage.getItem(MODE_KEY) || 'auto'; } catch (e) {}
      apply(saved);
      window.DQATheme = {
        get: function () { return document.documentElement.getAttribute('data-theme-mode') || 'auto'; },
        isDark: function () { return document.documentElement.classList.contains('dark'); },
        set: function (mode) { try { localStorage.setItem(MODE_KEY, mode); } catch (e) {} apply(mode); }
      };
      setInterval(function () { if (window.DQATheme.get() === 'auto') apply('auto'); }, 60000);
    })();
    </script>

        /* ===== DARK MODE ============================================== */
        :root { --paper-2:#eeeae1; --panel:#ffffff; --sub:#5f5b54; --sub-2:#8c877e; --star:transparent; }
        html.dark {
          --paper:#101827; --paper-2:#0d1420; --panel:#162033;
          --ink:#F3EDE3; --muted:#D6D0C6; --sub:#D6D0C6; --sub-2:#A8A296;
          --line:#3A455C; --gold:#D9B45F; --star:#F8E7B0;
          color-scheme: dark;
        }
        html.dark ::-webkit-scrollbar-track { background:#0b1220; }
        html.dark ::-webkit-scrollbar-thumb { background:#2a3549; }
        html.dark ::-webkit-scrollbar-thumb:hover { background:#3A455C; }

        /* --- CSS側の直書きを夜へ --- */
        html.dark nav { background:rgba(16,24,39,.94) !important; }
        html.dark section#about > div > div { background:var(--panel) !important; border-color:var(--line) !important; }
        html.dark .dark-media h3 { color:var(--ink) !important; }

        /* --- TSX の任意値クラスを属性セレクタで捕捉 --- */
        /* 順序が意味を持つ: gold → ink → sub → sub-2（hover:併記時に基底色を勝たせるため） */
        html.dark [class*="text-[#b1842b]"],
        html.dark [class*="text-[#8c671f]"]      { color:var(--gold) !important; }
        html.dark [class*="text-[#222222]"]      { color:var(--ink) !important; }
        html.dark [class*="text-[#5f5b54]"]      { color:var(--sub) !important; }
        html.dark [class*="text-[#6f6a62]"],
        html.dark [class*="text-[#8c877e]"]      { color:var(--sub-2) !important; }
        html.dark [class*="hover:text-[#222222]"]:hover { color:var(--ink) !important; }
        html.dark [class*="hover:text-[#b1842b]"]:hover { color:var(--gold) !important; }

        html.dark [class*="bg-[#f7f6f2]"]        { background-color:var(--paper) !important; }
        html.dark [class*="bg-[#eeeae1]"]        { background-color:var(--paper-2) !important; }
        html.dark [class*="bg-[#1a1c22]"]        { background-color:var(--panel) !important; }
        /* bg-white は ~= で完全一致のみ。bg-white/10 等の重ね用途と、dark-media の反転ボタンは除外 */
        html.dark [class~="bg-white"]:not([class*="text-black"]) { background-color:var(--panel) !important; }
        html.dark [class*="bg-[#222222]"]        { background-color:var(--ink) !important; color:var(--paper) !important; }
        html.dark [class*="bg-[#222222]"]:hover  { background-color:var(--gold) !important; color:#101827 !important; }

        html.dark [class*="border-[#222222]"]    { border-color:var(--line) !important; }
        html.dark [class*="border-[#b1842b]"]    { border-color:var(--gold) !important; }

        /* --- dark-media は演出として維持。純黒のみ夜空に沈まぬよう一段持ち上げ --- */
        html.dark .dark-media [class~="bg-black"],
        html.dark .dark-media [class~="bg-gray-950"],
        html.dark .dark-media [class~="bg-gray-900"] { background-color:#0d1522 !important; }
        html.dark .dark-media [class*="border-gray-800"]:not(:hover),
        html.dark .dark-media [class*="border-gray-700"]:not(:hover) { border-color:var(--line) !important; }

        /* --- 動画カード枠：ライト／ダークで一本化 --- */

        html.dark .dqa-video-card { border-color:var(--gold) !important; }

    <script>
      (function () {
        if (document.getElementById('dqa-starfield')) return;
        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var w = window.innerWidth;
        var k = w < 640 ? 0.5 : w < 1024 ? 0.72 : 1;
        var LAYERS = [
          { cls:'far', n:Math.round(48 * k), o0:[.13,.22], o1:[.36,.52], d:[8,15] },
          { cls:'mid', n:Math.round(26 * k), o0:[.24,.34], o1:[.58,.80], d:[7,12] },
          { cls:'near', n:Math.round(12 * k), o0:[.40,.50], o1:[.85,1.0], d:[6,10] }
        ];
        var TINTS = ['rgba(200,220,255,.88)', 'rgba(255,226,182,.90)'];
        function r(a, b) { return a + Math.random() * (b - a); }
        function topPct() { return (Math.pow(Math.random(), 1.75) * 100).toFixed(2) + '%'; }
        function leftPct() {
          var v = Math.pow(Math.random(), 1.22) * 116 - 8;
          return Math.min(99.2, Math.max(0.4, v)).toFixed(2) + '%';
        }
        var root = document.createElement('div');
        root.id = 'dqa-starfield';
        root.setAttribute('aria-hidden', 'true');
        var frag = document.createDocumentFragment();
        for (var L = 0; L < LAYERS.length; L++) {
          var layer = LAYERS[L];
          for (var i = 0; i < layer.n; i++) {
            var s = document.createElement('span');
            s.className = 'dqa-star ' + layer.cls;
            var st = s.style;
            st.top = topPct();
            st.left = leftPct();
            st.setProperty('--o0', r(layer.o0[0], layer.o0[1]).toFixed(2));
            st.setProperty('--o1', r(layer.o1[0], layer.o1[1]).toFixed(2));
            if (!reduce) {
              st.animationDuration = r(layer.d[0], layer.d[1]).toFixed(2) + 's';
              st.animationDelay = (-r(0, 14)).toFixed(2) + 's';
            }
            if (Math.random() < 0.2) st.background = TINTS[Math.random() < 0.5 ? 0 : 1];
            frag.appendChild(s);
          }
        }
        root.appendChild(frag);
        document.body.appendChild(root);
      })();
    </script>
