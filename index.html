    <meta name="color-scheme" content="light dark">
    <script>
    (function () {
      var MODE_KEY = 'dqa-theme';           // 'auto' | 'light' | 'dark'
      var DARK_FROM = 18, DARK_TO = 6;      // 18:00〜05:59 をダーク
      function isNight() { var h = new Date().getHours(); return h >= DARK_FROM || h < DARK_TO; }
      function resolve(mode) { return mode === 'dark' || (mode !== 'light' && isNight()); }
      function apply(mode) {
        var el = document.documentElement;
        // Typekit が className を文字列連結するため classList のみ使用
        if (resolve(mode)) el.classList.add('dark'); else el.classList.remove('dark');
        el.setAttribute('data-theme-mode', mode);
        try { window.dispatchEvent(new CustomEvent('dqa:themechange', { detail: { mode: mode, dark: resolve(mode) } })); } catch (e) {}
      }
      var saved = 'auto';
      try { saved = localStorage.getItem(MODE_KEY) || 'auto'; } catch (e) {}
      apply(saved);
      window.DQATheme = {
        get: function () { return document.documentElement.getAttribute('data-theme-mode') || 'auto'; },
        isDark: function () { return document.documentElement.classList.contains('dark'); },
        set: function (mode) { try { localStorage.setItem(MODE_KEY, mode); } catch (e) {} apply(mode); }
      };
      setInterval(function () { if (window.DQATheme.get() === 'auto') apply('auto'); }, 60000);
    })();
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #030712; }
        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #374151; }
        :root { --paper:#f7f4ec; --ink:#171512; --muted:#6f6a62; --line:#cfc7b8; --gold:#b1842b; }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { margin:0; background:var(--paper) !important; color:var(--ink) !important; font-family: 'Inter', sans-serif; }
        #root, #root > div { min-height:100vh; background:var(--paper) !important; }
        nav { position:fixed !important; inset:0 0 auto; z-index:50; background:rgba(247,244,236,.94) !important; border-bottom:1px solid var(--line) !important; color:var(--ink) !important; backdrop-filter:blur(8px); }
        nav > div { max-width:1200px; min-height:74px; margin:auto; padding:12px 32px; display:flex; align-items:center; justify-content:space-between; }
        nav a { color:var(--ink) !important; text-decoration:none; letter-spacing:.16em; font-size:11px; }
        nav img { max-height:48px !important; width:auto !important; }
        main { padding-top:74px; }
        main > section { position:relative; border-bottom:1px solid var(--line); padding:96px max(32px, 5vw); background:var(--paper) !important; color:var(--ink) !important; }
        main > section > div { max-width:1200px; margin:0 auto; }
        h1, h2, h3, .brand-serif { font-family: Georgia, 'Times New Roman', 'Yu Mincho', serif !important; color:var(--ink) !important; }
        .jp-display h1, .jp-display h2, .jp-display .brand-serif, .jp-ud-bold { font-family: "fot-udmincho-pr6n", sans-serif !important; font-weight: 700 !important; font-style: normal !important; }
        .jp-display h2 { font-weight: 700 !important; }
        .jp-light-display { font-family: "ten-mincho-antique", sans-serif !important; font-weight: 300 !important; font-style: normal; }
        .dark-media h3 { color: #fff !important; }
        h2 { font-size:clamp(2.8rem,6vw,5.8rem) !important; line-height:.98 !important; }
        p { color:var(--muted); line-height:1.9; }
        img { max-width:100%; }
        .hero-paper { min-height:720px !important; padding:0 !important; display:flex; align-items:center; }
        .hero-paper-image { position:absolute; inset:0; max-width:none !important; background:linear-gradient(90deg, rgba(247,244,236,.98) 0%, rgba(247,244,236,.92) 33%, rgba(247,244,236,.14) 62%, rgba(247,244,236,.02) 100%), url('/img/hero-reference.png') right center / cover no-repeat; }
        .hero-paper-copy { padding:150px 6vw 90px !important; }
        .hero-paper-copy h1 { font-size:clamp(3.4rem,7vw,7rem) !important; max-width:none; width:max-content; }
        .hero-paper-copy h1 .hero-line { display:block; white-space:nowrap; }
        .hero-paper-copy p { max-width:520px; }
        .hero-rule { display:inline-block; width:72px; height:1px; background:var(--ink); vertical-align:middle; }
        .hero-color-rule { display:flex; gap:18px; margin:28px 0 16px; }
        .hero-color-rule i { display:block; width:30px; height:3px; background:#bd2727; }
        .hero-color-rule i:nth-child(2){background:#5c2aa6}.hero-color-rule i:nth-child(3){background:#19a5cb}.hero-color-rule i:nth-child(4){background:#e36b27}.hero-color-rule i:nth-child(5){background:#e6b72d}.hero-color-rule i:nth-child(6){background:#5f9c45}
        .hero-caption { font-size:10px; letter-spacing:.22em; text-transform:uppercase; }
        section#about > div > div { background:#fff !important; border:1px solid var(--line); border-radius:0 !important; box-shadow:none !important; }
        section#about h2, main > section h2 { letter-spacing:-.06em; }
        main > section .grid { display:grid; gap:28px; }
        main > section img { object-fit:cover; }
        main > section button, main > section a { color:var(--ink); }
        footer { background:var(--paper) !important; border-top:1px solid var(--line) !important; color:var(--ink) !important; }
        footer img { max-height:44px !important; width:auto !important; }
        @media (max-width:800px){ nav > div{padding:10px 18px}.hero-paper{min-height:700px !important}.hero-paper-image{background:linear-gradient(180deg,rgba(247,244,236,.96) 0%,rgba(247,244,236,.78) 42%,rgba(247,244,236,.15) 100%),url('/img/hero-reference.png') 68% center/cover no-repeat}.hero-paper-copy{padding:128px 22px 70px !important}.hero-paper-copy h1{font-size:clamp(2.7rem,11.5vw,5rem) !important}main > section{padding:72px 20px}}

        /* ===== DARK MODE ============================================== */
        :root { --paper-2:#eeeae1; --panel:#ffffff; --sub:#5f5b54; --sub-2:#8c877e; --star:transparent; }
        html.dark {
          --paper:#101827; --paper-2:#0d1420; --panel:#162033;
          --ink:#F3EDE3; --muted:#D6D0C6; --sub:#D6D0C6; --sub-2:#A8A296;
          --line:#3A455C; --gold:#D9B45F; --star:#F8E7B0;
          color-scheme: dark;
        }
        html.dark ::-webkit-scrollbar-track { background:#0b1220; }
        html.dark ::-webkit-scrollbar-thumb { background:#2a3549; }
        html.dark ::-webkit-scrollbar-thumb:hover { background:#3A455C; }

        /* --- CSS側の直書きを夜へ --- */
        html.dark nav { background:rgba(16,24,39,.94) !important; }
        html.dark section#about > div > div { background:var(--panel) !important; border-color:var(--line) !important; }
        html.dark .dark-media h3 { color:var(--ink) !important; }

        /* --- TSX の任意値クラスを属性セレクタで捕捉 --- */
        /* 順序が意味を持つ: gold → ink → sub → sub-2（hover:併記時に基底色を勝たせるため） */
        html.dark [class*="text-[#b1842b]"],
        html.dark [class*="text-[#8c671f]"]      { color:var(--gold) !important; }
        html.dark [class*="text-[#222222]"]      { color:var(--ink) !important; }
        html.dark [class*="text-[#5f5b54]"]      { color:var(--sub) !important; }
        html.dark [class*="text-[#6f6a62]"],
        html.dark [class*="text-[#8c877e]"]      { color:var(--sub-2) !important; }
        html.dark [class*="hover:text-[#222222]"]:hover { color:var(--ink) !important; }
        html.dark [class*="hover:text-[#b1842b]"]:hover { color:var(--gold) !important; }

        html.dark [class*="bg-[#f7f6f2]"]        { background-color:var(--paper) !important; }
        html.dark [class*="bg-[#eeeae1]"]        { background-color:var(--paper-2) !important; }
        html.dark [class*="bg-[#1a1c22]"]        { background-color:var(--panel) !important; }
        /* bg-white は ~= で完全一致のみ。bg-white/10 等の重ね用途と、dark-media の反転ボタンは除外 */
        html.dark [class~="bg-white"]:not([class*="text-black"]) { background-color:var(--panel) !important; }
        html.dark [class*="bg-[#222222]"]        { background-color:var(--ink) !important; color:var(--paper) !important; }
        html.dark [class*="bg-[#222222]"]:hover  { background-color:var(--gold) !important; color:#101827 !important; }

        html.dark [class*="border-[#222222]"]    { border-color:var(--line) !important; }
        html.dark [class*="border-[#b1842b]"]    { border-color:var(--gold) !important; }

        /* --- dark-media は演出として維持。純黒のみ夜空に沈まぬよう一段持ち上げ --- */
        html.dark .dark-media [class~="bg-black"],
        html.dark .dark-media [class~="bg-gray-950"],
        html.dark .dark-media [class~="bg-gray-900"] { background-color:#0d1522 !important; }
        html.dark .dark-media [class*="border-gray-800"],
        html.dark .dark-media [class*="border-gray-700"] { border-color:var(--line) !important; }

        /* --- Hero：夜空画像（素材は Luna が public/img/ へ配置） --- */
        html.dark .hero-paper-image {
          background:
            linear-gradient(90deg, rgba(16,24,39,.97) 0%, rgba(16,24,39,.90) 33%, rgba(16,24,39,.18) 62%, rgba(16,24,39,.04) 100%),
            url('/img/hero-reference-night.png') right center / cover no-repeat;
        }
        @media (max-width:800px) {
          html.dark .hero-paper-image {
            background:
              linear-gradient(180deg, rgba(16,24,39,.96) 0%, rgba(16,24,39,.80) 42%, rgba(16,24,39,.20) 100%),
              url('/img/hero-reference-night.png') 68% center / cover no-repeat;
          }
        }

        /* --- 星：Hero 周辺のみ、ゆっくり控えめに --- */
        html.dark .hero-paper-image::after {
          content:""; position:absolute; inset:0; pointer-events:none;
          background-image:
            radial-gradient(1.4px 1.4px at 18% 22%, var(--star) 50%, transparent 51%),
            radial-gradient(1.1px 1.1px at 34% 12%, var(--star) 50%, transparent 51%),
            radial-gradient(1.6px 1.6px at 52% 30%, var(--star) 50%, transparent 51%),
            radial-gradient(1.0px 1.0px at 68% 16%, var(--star) 50%, transparent 51%),
            radial-gradient(1.5px 1.5px at 80% 34%, var(--star) 50%, transparent 51%),
            radial-gradient(1.2px 1.2px at 91% 20%, var(--star) 50%, transparent 51%),
            radial-gradient(1.0px 1.0px at 26% 46%, var(--star) 50%, transparent 51%),
            radial-gradient(1.3px 1.3px at 74% 52%, var(--star) 50%, transparent 51%);
          opacity:.42; animation: dqa-twinkle 9s ease-in-out infinite;
        }
        @keyframes dqa-twinkle { 0%,100% { opacity:.28 } 50% { opacity:.55 } }
        @media (prefers-reduced-motion: reduce) {
          html.dark .hero-paper-image::after { animation:none; opacity:.34; }
          html { scroll-behavior:auto; }
        }
    </style>
